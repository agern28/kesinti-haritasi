# infra: Terraform ve Helm dosyalarini dogrular. Kume kurmuyor, kimseye baglanmiyor.
# terraform validate ve helm lint/template icin kume gerekmiyor; gercek apply lokalde elle yapiliyor.
name: infra

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - helm/**
      - gitops/**
      - .github/workflows/**
      - .github/scripts/check-gitops.py
  pull_request:
    paths:
      - infra/**
      - helm/**
      - gitops/**
      - .github/workflows/**
      - .github/scripts/check-gitops.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Terraform runner imajinda gelmiyor (ilk kosu "command not found" ile kirildi),
      # bu yuzden action ile kuruluyor. Helm imajda kurulu, onun icin action yok.
      # wrapper kapali: adimlarin cikti kodu dogrudan gorunsun.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Surum
        run: terraform version

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/

      - name: terraform init ve validate
        run: |
          for dir in $(find infra -name '*.tf' -printf '%h\n' | sort -u); do
            echo "--- $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: helm lint
        run: |
          for chart in helm/*/Chart.yaml; do
            echo "--- $(dirname "$chart")"
            helm lint "$(dirname "$chart")"
          done

      - name: cluster-issuers iki modda da render ediliyor
        run: |
          helm template ci helm/cluster-issuers > /dev/null
          helm template ci helm/cluster-issuers \
            --set letsencrypt.enabled=true \
            --set letsencrypt.email=ci@example.com > /dev/null
          echo "iki mod da render edildi"

      - name: Let's Encrypt modunda e-posta zorunlulugu
        run: |
          if helm template ci helm/cluster-issuers --set letsencrypt.enabled=true > /dev/null 2>&1; then
            echo "HATA: e-posta olmadan render edilmemeliydi"
            exit 1
          fi
          echo "e-posta kontrolu calisiyor"

      - name: k3d yapilandirmasi gecerli YAML mi
        run: python3 -c "import yaml,sys; yaml.safe_load(open('infra/k3d/cluster.yaml')); print('cluster.yaml okunuyor')"

      - name: gitops Application'lari repoyla tutarli mi
        run: python3 .github/scripts/check-gitops.py

      - name: Workflow dosyalari gecerli YAML mi
        # promote-prod.yml bir kez gecersiz push edildi: blok skalarin icindeki girintisiz
        # satirlar blogu bitiriyordu. GitHub bunu ancak kosu sirasinda soyluyor.
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          hata = 0
          for dosya in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(dosya, encoding="utf-8"))
                  print(f"ok   {dosya}")
              except yaml.YAMLError as e:
                  print(f"HATA {dosya}: {e}")
                  hata = 1
          sys.exit(hata)
          PY

      - name: Ortam values dosyalari chart'lara uyuyor mu
        # Her ortamin values'i ilgili chart'la birlikte render edilebiliyor mu:
        # yanlis anahtar ya da bozuk YAML burada cikar.
        run: |
          for env in int prod; do
            for svc in collector api frontend; do
              helm template "$env-$svc" "helm/$svc" -f "gitops/$env/$svc.yaml" > /dev/null
              echo "ok   $env/$svc"
            done
          done
          helm template data helm/data -f gitops/data/values.yaml > /dev/null
          echo "ok   data"
          helm template monitoring helm/monitoring -f gitops/monitoring/values.yaml > /dev/null
          echo "ok   monitoring"

      - name: Panolar gecerli JSON mu
        run: |
          python3 - <<'PY'
          import glob, json, sys
          hata = 0
          for dosya in sorted(glob.glob("helm/monitoring/dashboards/*.json")):
              try:
                  pano = json.load(open(dosya, encoding="utf-8"))
                  print(f"ok   {dosya} -> {pano['uid']} ({len(pano['panels'])} panel)")
              except Exception as e:
                  print(f"HATA {dosya}: {e}")
                  hata = 1
          sys.exit(hata)
          PY
