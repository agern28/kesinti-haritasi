# INT'te duran surumu PROD'a tasiyan PR'i acar. Elle tetiklenir: PROD'a gecis bir karar,
# otomatik olmasin. PR birlesince Argo CD gitops/prod/*.yaml'i gorup PROD'a kurar.
name: promote-prod

on:
  workflow_dispatch:
    inputs:
      service:
        description: Servis (collector, api, frontend)
        required: true
        type: choice
        options: [collector, api, frontend]

permissions:
  contents: write
  pull-requests: write
  # Actions botunun actigi PR'in onay bekleyen kontrol kosusunu onaylamak icin.
  actions: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: INT'teki surumu PROD values'a yaz
        id: tasi
        run: |
          servis="${{ inputs.service }}"
          int_tag=$(yq '.image.tag' "gitops/int/$servis.yaml")
          prod_tag=$(yq '.image.tag' "gitops/prod/$servis.yaml")
          echo "INT: $int_tag, PROD: $prod_tag"
          if [ "$int_tag" = "$prod_tag" ]; then
            echo "PROD zaten $prod_tag, yapilacak bir sey yok"
            echo "degisti=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SURUM="$int_tag" yq -i '.image.tag = strenv(SURUM)' "gitops/prod/$servis.yaml"
          echo "degisti=true" >> "$GITHUB_OUTPUT"
          echo "int_tag=$int_tag" >> "$GITHUB_OUTPUT"
          echo "prod_tag=$prod_tag" >> "$GITHUB_OUTPUT"

      - name: PR ac
        if: steps.tasi.outputs.degisti == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          servis="${{ inputs.service }}"
          dal="promote/$servis-${{ steps.tasi.outputs.int_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$dal"
          git add "gitops/prod/$servis.yaml"
          git commit -m "chore(gitops): promote $servis ${{ steps.tasi.outputs.int_tag }} to PROD"
          git push origin "$dal"
          # Govde dosyaya yaziliyor: YAML blok skalarinin icine cok satirli metin gomulunce
          # girintisiz satirlar blogu bitiriyor ve workflow dosyasi gecersiz oluyor.
          printf '%s\n' \
            "INT'te ${{ steps.tasi.outputs.int_tag }} calisiyor, PROD ${{ steps.tasi.outputs.prod_tag }} surumunde." \
            "Bu PR birlesince Argo CD PROD'u ${{ steps.tasi.outputs.int_tag }} surumune gecirir." \
            "" \
            "Kontrol listesi:" \
            "- [ ] INT'te uygulama acilip bakildi" \
            "- [ ] Argo CD'de int-$servis Synced ve Healthy" \
            "- [ ] CHANGELOG guncel" > /tmp/pr-body.md
          # Dal her durumda push edildi. PR acmak depo ayarina bagli:
          # Settings > Actions > General > Workflow permissions >
          # "Allow GitHub Actions to create and approve pull requests".
          # Kapaliysa adim burada kiriliyor, dal duruyor, PR elle acilabiliyor.
          if ! gh pr create \
            --base main \
            --head "$dal" \
            --title "Promote $servis ${{ steps.tasi.outputs.int_tag }} to PROD" \
            --body-file /tmp/pr-body.md
          then
            echo "::error::PR acilamadi. Dal push edildi: $dal"
            echo "::error::Elle acmak icin: ${{ github.server_url }}/${{ github.repository }}/compare/main...$dal"
            echo "::error::Actions'in PR acmasina izin vermek icin: Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests"
            exit 1
          fi
          echo "dal=$dal" >> "$GITHUB_ENV"

      - name: Kontrolleri onayla, bitsin, sonra birlestir
        if: steps.tasi.outputs.degisti == 'true'
        # PR'i kontroller bitmeden birlestirmek, o dalda baslamis kosuyu iptal ediyor ve Actions
        # listesinde "failure" olarak kaliyordu (1.0.2 ve 1.0.3 terfilerinde boyle oldu).
        #
        # Iki ayrinti var:
        # - GITHUB_TOKEN ile acilan PR'in kosulari kendiliginden baslamiyor, "action_required"
        #   durumunda onay bekliyor. Asagida API ile onaylaniyor (permissions: actions: write).
        # - Hic kontrol yoksa "gh pr checks" 1 donuyor ve "no checks reported" yaziyor; bu bir
        #   hata degil, o yuzden ciktiya bakiliyor.
        env:
          GH_TOKEN: ${{ github.token }}
          DEPO: ${{ github.repository }}
        run: |
          sleep 15
          onaylanan=0
          for id in $(gh api "repos/$DEPO/actions/runs?per_page=30" \
                --jq ".workflow_runs[] | select(.head_branch==\"$dal\") | select(.status==\"action_required\" or .conclusion==\"action_required\") | .id"); do
            if gh api -X POST "repos/$DEPO/actions/runs/$id/approve" >/dev/null 2>&1; then
              echo "onaylandi: $id"
              onaylanan=$((onaylanan + 1))
            else
              echo "::warning::kosu onaylanamadi: $id"
            fi
          done
          [ "$onaylanan" -gt 0 ] && sleep 15

          set +e
          cikti=$(gh pr checks "$dal" --watch --interval 15 2>&1)
          kod=$?
          set -e
          printf '%s\n' "$cikti"
          if [ "$kod" -ne 0 ] && ! printf '%s' "$cikti" | grep -q 'no checks reported'; then
            echo "::error::kontroller gecmedi, PR birlestirilmedi: $dal"
            exit 1
          fi
          gh pr merge "$dal" --squash --delete-branch --auto
