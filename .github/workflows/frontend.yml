# frontend: test + kapsam alt siniri, build, SonarQube Cloud, imaj + Trivy.
# frontend-vX.Y.Z tag'inde imaj GHCR'a gidiyor ve GitHub Release aciliyor.
# Imaj CHANGELOG.md'yi de okudugu icin build context repo koku.
name: frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - CHANGELOG.md
      - .github/workflows/frontend.yml
    # Tag push'larinda paths filtresi uygulanmiyor
    tags: ['frontend-v*']
  pull_request:
    paths:
      - frontend/**
      - CHANGELOG.md
      - .github/workflows/frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  SERVICE: frontend
  IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar yeni kodu ve satir sahiplerini gecmisten buluyor
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test ve kapsam (alt sinir vite.config.js'te)
        run: npm run test:coverage
      - run: npm run build
      - name: Kapsam raporu
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
      # Tag'de Sonar yok: tag'lenen commit main'de zaten analiz edilip gate'ten geciyor. SonarCloud tag'i
      # ayri bir dal sayiyor, o dalin ilk analizinde gate hesaplanamiyor ve adim kiriliyordu (2026-09-15).
      - name: SonarQube Cloud (quality gate)
        if: env.SONAR_TOKEN != '' && !startsWith(github.ref, 'refs/tags/')
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          projectBaseDir: frontend
          args: -Dsonar.qualitygate.wait=true
      - name: Sonar atlandi
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN tanimli degil, Sonar analizi atlandi"

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub Release
      packages: write # GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Surum
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/${SERVICE}-v* ]]; then
            echo "version=${GITHUB_REF_NAME#"${SERVICE}"-v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Imaji derle
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:ci
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Trivy (duzeltmesi olan CRITICAL acik varsa kirilir)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: cyclonedx
          output: sbom-frontend.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-sbom
          path: sbom-frontend.cdx.json
      - name: GHCR girisi
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GHCR'a gonder
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
      - name: GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHANGELOG.md'deki "## [X.Y.Z]" bolumu release notu oluyor
          awk -v v="[$VERSION]" 'index($0, "## ") == 1 { p = index($0, v) > 0; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "CHANGELOG.md'de $VERSION bolumu yok." > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$SERVICE $VERSION" --notes-file notes.md "sbom-$SERVICE.cdx.json"
