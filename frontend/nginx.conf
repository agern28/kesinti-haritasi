# Bu dosya imajda /etc/nginx/templates/default.conf.template: nginx acilirken ortam degiskenleri
# (sadece tanimli olanlar, burada APP_ENV) doldurulup conf.d/default.conf'a yaziliyor.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Ilce sinirlari (topojson) ~490 KB, gzip ile ~155 KB.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite'in urettigi dosyalarin adinda hash var, degisince adi da degisiyor.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /geo/ {
        expires 7d;
    }

    # Ortam etiketi calisma aninda: ayni imaj INT'te ve PROD'da calisiyor, fark container'in APP_ENV'i.
    location = /env.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        return 200 '{"environment":"${APP_ENV}"}';
    }

    # SSE icin buffering kapali, baglanti uzun sure acik kalabilir.
    location /api/stream {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
