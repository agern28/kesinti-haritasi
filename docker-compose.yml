# Lokal gelistirme ortami:
#   cp .env.example .env   (parolayi degistir)
#   docker compose up --build
# Parolalar .env dosyasindan gelir, .env repoya girmez.
name: kesinti-haritasi

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kesinti}
      POSTGRES_USER: ${POSTGRES_USER:-kesinti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD eksik, .env.example dosyasini .env olarak kopyala}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  collector:
    build: ./services/collector
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10
    mem_limit: 384m

  api:
    build: ./services/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kesinti}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kesinti}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD eksik, .env.example dosyasini .env olarak kopyala}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10
    mem_limit: 512m

  frontend:
    build:
      # Kok dizin: "Yenilikler" penceresi CHANGELOG.md'yi okuyor. Gonderilen dosyalar
      # frontend/Dockerfile.dockerignore'da (sadece frontend/ ve CHANGELOG.md).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_VERSION: 0.1.0
    environment:
      # Ortam etiketi calisma aninda (nginx /env.json); INT/PROD'da Helm values'tan gelecek.
      APP_ENV: LOCAL
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 64m

volumes:
  pgdata:
  redisdata:
