apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kesinti-prod
  sources:
    - repoURL: https://github.com/agern28/kesinti-haritasi.git
      targetRevision: main
      path: helm/frontend
      helm:
        valueFiles:
          - $values/gitops/prod/frontend.yaml
    - repoURL: https://github.com/agern28/kesinti-haritasi.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
