image:
  repository: ghcr.io/agern28/kesinti-haritasi/frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicas: 1

port: 8080

# nginx /env.json ile tarayiciya veriyor; ayni imaj INT'te ve PROD'da.
appEnv: INT

nginx:
  # Bos birakilirsa chart'in kuruldugu namespace'teki api Service'inin tam adi kullanilir:
  # http://api.<namespace>.svc.cluster.local:8080
  #
  # Kisa ad ("http://api:8080") burada CALISMIYOR: nginx'in resolver direktifi
  # /etc/resolv.conf'taki search listesini kullanmiyor, adi oldugu gibi soruyor ve
  # CoreDNS bos cevap veriyor. Sonuc 502. (Compose'da Docker DNS kisa adi coziyor.)
  apiUpstream: ""
  # Bos apiUpstream icin kullanilacak api Service portu.
  apiPort: 8080
  # nginx'in resolver direktifi IP istiyor, isim kabul etmiyor. k3s'te CoreDNS'in
  # ClusterIP'si varsayilan olarak bu; kontrol: kubectl -n kube-system get svc kube-dns
  resolver: 10.43.0.10

ingress:
  enabled: true
  className: traefik
  host: int.kesinti.localhost
  tls:
    enabled: true
    # Faz 6'da kurulan issuer. Bulutta letsencrypt olacak.
    clusterIssuer: kesinti-ca
    secretName: frontend-tls

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 96Mi
