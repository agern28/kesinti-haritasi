{{- if .Values.ca.enabled }}
# Uc adim: once kendini imzalayan bir issuer, onunla bir CA sertifikasi,
# sonra o CA'yi kullanan issuer. Ingress'ler en sondakini (kesinti-ca) kullanir.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kesinti-ca
  namespace: {{ .Values.certManagerNamespace }}
spec:
  isCA: true
  commonName: {{ .Values.ca.commonName | quote }}
  secretName: {{ .Values.ca.secretName }}
  duration: {{ .Values.ca.duration }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kesinti-ca
spec:
  ca:
    secretName: {{ .Values.ca.secretName }}
{{- end }}
