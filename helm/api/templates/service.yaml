apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: kesinti-haritasi
  annotations:
    kesinti-haritasi/metrics-path: {{ .Values.metrics.path | quote }}
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
