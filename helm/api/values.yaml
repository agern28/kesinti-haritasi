image:
  repository: ghcr.io/agern28/kesinti-haritasi/api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicas: 1

port: 8080

postgres:
  host: postgres.kesinti-data.svc.cluster.local
  port: 5432
  # Ortam basina ayri veritabani; gitops values'ta veriliyor.
  database: kesinti_int
  user: kesinti
  # Parolayi Terraform uretip bu secret'a yaziyor, repoda yok.
  existingSecret: kesinti-db
  passwordKey: postgres-password

redis:
  host: redis.kesinti-data.svc.cluster.local
  port: 6379
  database: 0

java:
  options: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

resources:
  requests:
    cpu: 150m
    memory: 320Mi
  limits:
    memory: 640Mi

# SSE baglantilari uzun yasiyor; pod kapanirken aniden kesilmesin.
terminationGracePeriodSeconds: 45

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

metrics:
  path: /actuator/prometheus
